<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connections — Custom Puzzles</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(26,23,20,0.8); z-index:2000; align-items:center; justify-content:center;">
  <div style="background:var(--bg); padding:32px; border-radius:var(--radius); max-width:400px; width:90%; text-align:center; box-shadow: var(--shadow);">
    <h2 id="modal-title" style="font-family:'DM Serif Display', serif; margin-bottom:12px;">Message</h2>
    <p id="modal-body" style="font-size:0.9rem; margin-bottom:24px; color:var(--ink-muted); line-height:1.5;"></p>
    <button onclick="closeModal()" style="background:var(--ink); color:var(--bg); border:none; padding:12px 24px; border-radius:var(--radius); cursor:pointer; font-family:'DM Mono', monospace; text-transform:uppercase; font-size:0.75rem;">Close</button>
  </div>
</div>

<header>
  <h1>Connections</h1>
  <span>Custom Puzzles</span>
</header>

<div class="tabs">
  <button class="tab active" id="tab-browse" onclick="switchTab('browse')">Browse</button>
  <button class="tab" id="tab-create" onclick="switchTab('create')">Create</button>
</div>

<div id="browse-view" class="view active">
  <div id="gallery-container"></div>
</div>

<div id="create-view" class="view">
  <div class="builder-section">
    <h2>New Puzzle</h2>
    <div class="meta-row">
      <input type="text" id="puzzle-title" placeholder="Puzzle title…" maxlength="60">
      <input type="text" id="puzzle-author" placeholder="Author name">
    </div>
    <div class="categories-grid" id="categories-grid"></div>
    <div style="margin-top:20px;">
      <button class="btn-primary" style="padding:10px 20px; background:var(--ink); color:#fff; border:none; cursor:pointer;" onclick="savePuzzle()">Save Puzzle</button>
    </div>
  </div>
</div>

<div id="game-view" class="view">
  <button class="back-btn" onclick="exitGame()">← Back</button>
  <div id="game-container"></div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
