<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connections — Custom Puzzles</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="win-modal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <h2>🧩 Puzzle Solved 🧩</h2>
    <p>You found all the connections!</p>
    <div class="modal-actions">
      <button class="btn-primary" onclick="closeWinModal()">Back to Menu</button>
    </div>
  </div>
</div>

<div id="loss-modal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <h2 style="color: var(--ink);">Game Over</h2>
    <p>Better luck next time! You've used up all your mistakes.</p>
    <div class="modal-actions" style="display: flex; gap: 10px; justify-content: center; margin-top: 24px;">
      <button class="btn-secondary" onclick="closeLossModal()" style="background:#ccc; color:var(--ink); border:none; padding:12px 24px; border-radius:var(--radius); cursor:pointer;">Back to Menu</button>
      <button class="btn-primary" onclick="restartCurrentPuzzle()" style="background:var(--ink); color:var(--bg); border:none; padding:12px 24px; border-radius:var(--radius); cursor:pointer;">Try Again</button>
    </div>
  </div>
</div>

<div id="confirm-Window" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <h2>Are you sure?</h2>
    <p>This puzzle will be deleted permanently.</p>
    
    <div class="modal-actions" style="display:flex; gap:10px; justify-content:center; margin-top:20px;">
      <button onclick="closeConfirmWindow()" class="btn-secondary" style="background:#ccc; padding:10px 20px; border:none; border-radius:6px; cursor:pointer;">
        Cancel
      </button>
      
      <button onclick="executeDelete()" class="btn-primary" style="background:red; color:white; padding:10px 20px; border:none; border-radius:6px; cursor:pointer;">
        Delete Puzzle
      </button>
    </div>
  </div>
</div>

<header>
  <div id="solved-progress" class="solved-progress">Solved 0 / 0</div>
  <h1>Connections List</h1>
  <div id="connection-status" class="connection-status connecting">Connecting</div>
</header>

<div class="top-controls">
  <div class="tabs">
    <button class="tab active" id="tab-browse" onclick="switchTab('browse')">Browse</button>
    <button class="tab" id="tab-create" onclick="switchTab('create')">Create</button>
  </div>
  <div class="browse-toolbar" id="browse-toolbar">
    <label for="sort-puzzles">Sort by</label>
    <select id="sort-puzzles" onchange="setPuzzleSort(this.value)">
      <option value="date_desc">Date Created (Newest)</option>
      <option value="date_asc">Date Created (Oldest)</option>
      <option value="author_asc">Author (A-Z)</option>
    </select>
  </div>
</div>

<div id="browse-view" class="view active">
  <div id="gallery-container"></div>
</div>

<div id="create-view" class="view">
  <div class="builder-section">
    <h2 id="builder-heading">New Puzzle</h2>

    <div id="builder-import-section" class="meta-row import-section" style="margin-bottom: 20px; border-bottom: 1px solid var(--rule); padding-bottom: 20px;">
        <input type="text" id="swellgarfo-url" placeholder="Paste Swellgarfo link here...">
        <button id="import-btn" class="btn-primary" onclick="importFromSwellgarfo()">Auto-Import</button>
    </div>
    
    <div class="meta-row">
      <input type="text" id="puzzle-title" placeholder="Puzzle title…" maxlength="60">
      <input type="text" id="puzzle-author" placeholder="Author name">
    </div>
    <div class="categories-grid" id="categories-grid"></div>
    <div style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap;">
      <button id="save-puzzle-btn" class="btn-primary" style="padding:10px 20px; background:var(--ink); color:#fff; border:none; cursor:pointer;" onclick="savePuzzle()">Save Puzzle</button>
      <button id="cancel-edit-btn" class="btn-secondary" style="display:none; padding:10px 20px; background:#ccc; color:var(--ink); border:none; cursor:pointer;" onclick="cancelEditPuzzle()">Cancel Edit</button>
    </div>
  </div>
</div>

<div id="game-view" class="view">
  <button class="back-btn" onclick="exitGame()">← Back</button>
  <div id="game-container"></div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
